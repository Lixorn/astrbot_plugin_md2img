name: astrbot_plugin_md2img
display_name: Markdown 图片渲染
short_desc: 无需浏览器的 Markdown 转图片插件，支持 Agent 感知、图文混排、表格、代码块、Emoji 与 LLM 自动转图
desc: >
  使用 Pillow 将 Markdown 渲染为清晰的聊天图片，无需浏览器或 Playwright。
  支持标题、列表、引用、代码块、表格、Emoji、外链图片、Agent 能力提示，以及 LLM 最终图文消息链合并渲染。
version: 1.1.0
author: Lixorn
repo: https://github.com/Lixorn/astrbot_plugin_md2img
social_link: https://github.com/Lixorn
tags:
  - markdown
  - image
  - tools
  - llm
